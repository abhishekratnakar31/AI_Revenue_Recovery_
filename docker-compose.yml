version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: recoverai_postgres
    restart: always
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai_secret
      POSTGRES_DB: recoverai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverai -d recoverai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
